name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project name'
        required: true
        default: 'my_app'
      build_type:
        description: 'Build type (release/debug/profile)'
        required: true
        default: 'release'
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_type }} --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}-${{ github.event.inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
          retention-days: 7
